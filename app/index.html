<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iTIMS</title>
<meta name="description" content="iTIMS: IT Inventory Management System. Every IT device at a site, on your phone and PC, online or offline.">
<meta name="theme-color" content="#5b4be6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="iTIMS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="wrap">
  <header class="head">
    <div class="title-row">
      <a href="#/" class="logo" aria-label="iTIMS home"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></a>
      <h1>iTIMS <span class="sub" style="font-weight:500;color:var(--muted);font-size:15px;letter-spacing:0">IT Inventory Management System</span></h1>
      <span id="headPill"></span>
      <span class="pill c-off offline-pill">Offline</span>
    </div>
    <div class="summary" id="summary"></div>
    <div class="actions">
      <button class="btn primary" data-action="add" type="button"></button>
      <button class="btn" data-action="scan" type="button"></button>
      <nav class="seg" aria-label="Views" id="nav">
        <a href="#/">Dashboard</a>
        <a href="#/photos">Photos</a>
        <a href="#/floorplan">Floorplan</a>
        <a href="#/reports">Reports</a>
        <a href="#/settings">Settings</a>
      </nav>
    </div>
    <div class="actions" style="margin-top:4px">
      <div class="gs">
        <label for="q" style="position:absolute;left:-9999px">Search all devices</label>
        <svg class="mag" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search asset #, hostname, IP, MAC, user, location, ticket…" aria-autocomplete="list" aria-controls="sugg">
        <kbd>/</kbd>
        <div class="sugg" id="sugg" role="listbox" hidden></div>
      </div>
      <div class="filter-note" id="filterNote" hidden></div>
    </div>
  </header>
  <main id="view" class="wrap" style="gap:18px"></main>
  <footer class="install-tip" id="foot"></footer>
</div>
<div id="printArea"></div>
<noscript><p style="padding:20px">iTIMS needs JavaScript turned on.</p></noscript>
<script src="vendor/qrcode.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
